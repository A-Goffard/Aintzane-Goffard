services:
  frontend:
    image: node:20-alpine
    working_dir: /app
    container_name: aintzane_frontend_dev
    command: sh -c "npm install && npm run serve"
    ports:
      - "8080:8080"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
