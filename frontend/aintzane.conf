# Nginx DENTRO del contenedor. El Nginx del VPS (con el certificado SSL)
# reenvía aintzanegoffard.com -> 127.0.0.1:8081 -> este servidor.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Redirecciones relativas: así no aparece http:// ni el puerto interno detrás del proxy
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 1. Assets con hash (js/css/fuentes) e imágenes: caché larga
    location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|ico|svg|avif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 2. URLs de la web antigua (HTML estático) -> rutas nuevas de Vue
    location = /paginas/privacidad.html { return 301 /privacidad; }
    location = /proyectos/proyecto1.html { return 301 /proyectos/portfolio-personal; }
    location = /proyectos/proyecto2.html { return 301 /proyectos/web-geobizi; }
    location = /proyectos/proyecto3.html { return 301 /proyectos/gestion-dispositivos; }
    location = /proyectos/proyecto4.html { return 301 /proyectos/soft-skills; }
    location = /proyectos/proyecto5.html { return 301 /proyectos/yincana-sopelakosta; }
    location = /proyectos/proyecto6.html { return 301 /proyectos/bilbostack; }
    location = /proyectos/proyecto7.html { return 301 /proyectos/web-egeo; }

    # 3. CV en PDF: que se pueda ver en el navegador y se actualice pronto
    location = /Aintzane-Goffard-CV.pdf {
        add_header Cache-Control "public, max-age=86400";
    }

    # 4. SPA de Vue: index.html siempre fresco para que se vean los cambios al desplegar
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
