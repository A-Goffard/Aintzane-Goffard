# Nombre de proyecto fijo: no depende de la carpeta y no se mezcla con Geobizi
name: aintzanegoffard

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    image: aintzanegoffard-frontend
    container_name: aintzane_frontend
    ports:
      # Solo accesible desde el propio VPS: el Nginx del sistema hace de proxy (con SSL)
      - "127.0.0.1:8081:80"
    restart: always
